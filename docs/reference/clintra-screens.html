<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clintra — مكتبة الشاشات الكاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16211D;--paper:#FBFAF7;--card:#fff;--rule:#E2E3DC;--rs:#EDEEE8;
--pine:#1D5B4A;--ps:#E8F0EC;--pm:#4C8571;--red:#B23A34;--reds:#FAECEA;
--amb:#8A6A22;--ambs:#F6EFDD;--ash:#6E7370;--pur:#453FA0;--purs:#EDEBFB;
--dsp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
--bd:"IBM Plex Sans Arabic",Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--bd);font-size:15px;line-height:1.65}
h1,h2,h3,h4{font-family:var(--dsp);font-weight:500;line-height:1.3}
.muted{color:var(--ash);font-weight:300}
.sm{font-size:13px}.xs{font-size:11.5px}

/* shell */
.shell{display:grid;grid-template-columns:1fr 262px;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
aside{border-right:1px solid var(--rule);background:var(--card);
position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 0}
@media(max-width:900px){aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}}
.brand{padding:0 16px 14px;border-bottom:1px solid var(--rs);margin-bottom:10px}
.brand .n{font-family:var(--dsp);font-size:19px;font-weight:600}
.brand .n b{color:var(--pine)}
.ph{padding:12px 16px 5px;font-size:11.5px;color:var(--pine);font-weight:600;letter-spacing:.03em}
.nv{display:block;width:100%;text-align:right;font-family:var(--bd);font-size:13.5px;
color:var(--ash);background:none;border:none;padding:7px 16px;cursor:pointer;border-right:2px solid transparent}
.nv:hover{background:var(--paper);color:var(--ink)}
.nv[aria-current="true"]{background:var(--ps);color:var(--pine);font-weight:500;border-right-color:var(--pine)}
main{padding:26px 30px 70px;max-width:1000px}
@media(max-width:640px){main{padding:18px 16px 50px}}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
flex-wrap:wrap;margin-bottom:6px}
.hd h2{font-size:25px;font-weight:600}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 20px}
.meta span{font-size:11.5px;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;color:var(--ash)}
.meta span.p{background:var(--ps);border-color:#B6D0C6;color:var(--pine)}
.nav2{display:flex;gap:8px;margin-top:26px}
.nav2 button{font-family:var(--bd);font-size:13.5px;background:#fff;border:1px solid var(--rule);
border-radius:8px;padding:8px 16px;cursor:pointer;color:var(--ink)}
.nav2 button:hover{border-color:var(--pm)}
.nav2 button:disabled{opacity:.4;cursor:not-allowed}
.why{background:var(--ambs);border-right:3px solid var(--amb);border-radius:8px;
padding:11px 14px;font-size:13.5px;color:#5F4A17;margin-top:18px}

/* ===== mock frames ===== */
.frame{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;
box-shadow:0 18px 40px -32px rgba(22,33,29,.5)}
.frame.phone{max-width:330px;margin:0 auto;border-radius:26px;padding:9px;background:var(--ink);border:none}
.frame.phone .inner{background:#fff;border-radius:18px;overflow:hidden}
.frame.print{max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--rule);padding:26px}
.frame.tv{background:#0E3B2E;border:none;border-radius:12px;padding:34px 20px;text-align:center;color:#fff}

.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
padding:10px 13px;border-bottom:1px solid var(--rule);background:var(--paper)}
.ft{font-family:var(--dsp);font-size:14.5px;font-weight:500}
.fs{padding:8px 13px;border-bottom:1px solid var(--rule);display:flex;gap:15px;
font-size:12.5px;color:var(--ash);flex-wrap:wrap}
.fs .bad{color:var(--red)}
.fb{display:grid;grid-template-columns:118px 1fr}
@media(max-width:640px){.fb{grid-template-columns:1fr}}
.fn{border-left:1px solid var(--rule);background:var(--paper);padding:9px 0}
.fn div{font-size:12.5px;padding:6px 12px;color:var(--ash)}
.fn div.on{color:var(--pine);font-weight:500;background:var(--ps)}
.fm{padding:12px}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.g3{grid-template-columns:repeat(2,1fr)}}
.sl{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-height:64px}
.sl .t{font-size:11.5px;color:var(--ash)}
.sl .n{font-size:13.5px;margin-top:1px}
.sl .s{font-size:11px;color:var(--ash)}
.sl.free{border-style:dashed;display:flex;align-items:center;justify-content:center;font-size:22px;color:#C2C4BD}
.sl.now{background:var(--pine);border-color:var(--pine)}
.sl.now .t{color:#A9CFC1}.sl.now .n{color:#fff;font-weight:600}.sl.now .s{color:#C6E2D7}
.sl.her{background:var(--ps);border-color:#B6D0C6}
.sl.her .t,.sl.her .s{color:var(--pm)}.sl.her .n{color:var(--pine);font-weight:600}
.sl.mis{background:var(--reds);border-color:#E5BDB9}
.sl.mis .t,.sl.mis .n,.sl.mis .s{color:var(--red)}
.sl.pst{background:#F6F5F1}.sl.pst .t,.sl.pst .n,.sl.pst .s{color:#A8AAA3}

.lr{display:flex;align-items:center;gap:11px;padding:9px 12px;border-bottom:1px solid var(--rs)}
.lr:last-child{border-bottom:none}
.lr .gw{flex:1;min-width:0}
.lr .t1{font-size:13.5px}.lr .t2{font-size:11.5px;color:var(--ash)}
.lr .rt{font-size:12px;color:var(--ash);white-space:nowrap}
.lr.done{background:#F6F5F1}.lr.done *{color:#A8AAA3}
.lr.acc{background:var(--ps)}.lr.acc .t1{color:var(--pine);font-weight:600}
.qn{width:31px;height:31px;border-radius:6px;border:1px solid var(--rule);flex:none;
display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ash)}
.qn.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.qn.ok{background:var(--ps);border-color:#B6D0C6;color:var(--pm)}

.fld{border:1px solid var(--rule);border-radius:6px;height:38px;display:flex;align-items:center;
padding:0 11px;font-size:13.5px;color:var(--ash);margin-bottom:7px}
.fld.on{border-color:var(--pine);box-shadow:0 0 0 3px var(--ps);color:var(--ink)}
.lb{font-size:11.5px;color:var(--ash);margin-bottom:3px}
.bt{background:var(--pine);color:#fff;border-radius:6px;padding:9px 16px;font-size:13.5px;
font-family:var(--dsp);font-weight:500;display:inline-block;text-align:center}
.bt.g{background:#fff;color:var(--ink);border:1px solid var(--rule)}
.bt.d{background:#fff;color:var(--red);border:1px solid #E5BDB9}
.bt.w{display:block}
.tg{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px}
.tg.a{background:var(--ps);color:var(--pine)}
.tg.b{background:var(--reds);color:var(--red)}
.tg.c{background:var(--ambs);color:var(--amb)}
.tg.d{background:var(--purs);color:var(--pur)}
.tg.e{background:var(--rs);color:var(--ash)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;font-size:11px;color:var(--ash);font-weight:500;padding:6px 7px;border-bottom:1px solid var(--rule)}
.tbl td{padding:8px 7px;border-bottom:1px solid var(--rs)}
.kv{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--rs);font-size:13px}
.kv.tot{background:#F6F5F1;font-weight:600}
.kv.dif{background:var(--ambs);color:var(--amb);font-weight:600}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:12px}
.mt{border:1px solid var(--rule);border-radius:8px;padding:10px 11px;background:var(--paper)}
.mt .k{font-size:11px;color:var(--ash)}
.mt .v{font-family:var(--dsp);font-size:19px;font-weight:600;margin-top:2px}
.mt.bad{background:var(--reds);border-color:#E5BDB9}.mt.bad .v{color:var(--red)}
.mt.ok{background:var(--ps);border-color:#B6D0C6}.mt.ok .v{color:var(--pine)}
.msg{margin:9px 12px;padding:9px 11px;border-radius:12px;font-size:13px}
.msg.them{background:#F1F1EC;border-top-right-radius:4px}
.msg.me{background:var(--pine);color:#fff;border-top-left-radius:4px;margin-right:50px}
.mbt{display:flex;gap:6px;margin-top:8px}
.mbt span{flex:1;text-align:center;font-size:12px;border:1px solid var(--rule);background:#fff;
border-radius:6px;padding:6px 0;color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px}
.tgrid div{border:1px solid var(--rule);border-radius:6px;text-align:center;padding:7px 0;font-size:12.5px}
.tgrid div.off{color:#C4C5BE;background:#F7F7F3;text-decoration:line-through}
.tgrid div.sel{background:var(--pine);color:#fff;border-color:var(--pine)}
.teeth{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:0 12px}
.teeth i{border:1px solid var(--rule);border-radius:4px;height:34px;display:flex;align-items:flex-end;
justify-content:center;font-size:9.5px;color:var(--ash);font-style:normal;padding-bottom:2px}
.teeth i.s1{background:var(--reds);border-color:#E5BDB9}
.teeth i.s2{background:var(--purs);border-color:#C3BEEE}
.teeth i.on{border:2px solid var(--pine)}
.stp{display:flex;gap:10px;padding:0 12px 9px;position:relative}
.stp .bl{width:19px;height:19px;border-radius:50%;border:1px solid var(--rule);background:#fff;
flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ash)}
.stp .bl.on{background:var(--pine);border-color:var(--pine);color:#fff}
.stp .sc{font-size:13px}.stp .sd{font-size:11.5px;color:var(--ash)}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:200px;margin:0 auto;padding:12px}
.pin div{border:1px solid var(--rule);border-radius:8px;padding:11px 0;text-align:center;font-size:16px}
.dots{display:flex;gap:9px;justify-content:center;padding:14px 0 4px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--rule)}
.dots i.f{background:var(--pine)}
.slider{height:5px;background:#EFEEE9;border-radius:9px;position:relative;margin:10px 0}
.slider b{position:absolute;right:0;top:0;height:5px;background:var(--pine);border-radius:9px;width:55%}
.slider i{position:absolute;left:45%;top:-5px;width:15px;height:15px;border-radius:50%;background:var(--pine)}
.bar{height:7px;background:#F0EFEA;border-radius:9px;overflow:hidden;margin-top:7px}
.bar b{display:block;height:7px;background:var(--pine);border-radius:9px}
</style>
</head>

  <main>
    <div class="hd">
      <div>
        <div class="muted xs" id="pnum">—</div>

      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div id="stage"></div>
    <div class="why" id="why"></div>
    <div class="nav2">
      <button id="prev">السابقة ›</button>
      <button id="next">‹ التالية</button>
    </div>
  </main>

  <aside>
    <div class="brand">
      <div class="n">Clin<b>tra</b></div>

</div>

 '<div class="t2">بيرجع ملخص وبتتقفل الحالة</div></div></div></div></div>'},

{p:5,n:'شاشة غرفة الانتظار',u:'المرضى',t:'queue (display token)',
 why:'برابط موقّع بينتهي، وبوضع خصوصية بالأرقام بدل الأسماء، وبوضع Kiosk بدون شريط عنوان.',
 h:'<div class="frame tv">'+
 '<div style="font-size:13px;opacity:.85;margin-bottom:20px">غرفة الانتظار</div>'+
 '<div style="background:rgba(255,255,255,.12);border-radius:14px;padding:22px;max-width:330px;margin:0 auto">'+
 '<div style="font-size:12px;opacity:.85">يُرجى التوجّه</div>'+
 '<div style="font-family:var(--dsp);font-size:56px;font-weight:600;line-height:1.1">٠٠٣</div>'+
 '<div style="font-size:13px;opacity:.9">د. أحمد محمد</div></div>'+
 '<div style="display:flex;gap:12px;justify-content:center;margin-top:18px;font-size:12px;opacity:.85">'+
 '<span>في الانتظار: ٥</span><span>·</span><span>تم خدمتهم: ١٢</span></div></div>'}
];

var idx=0;
var $=function(i){return document.getElementById(i);};

function nav(){
 var h='',last=null;
 S.forEach(function(s,i){
  if(s.p!==last){h+='<div class="ph">'+PH[s.p]+'</div>';last=s.p;}
  h+='<button class="nv" data-i="'+i+'" aria-current="'+(i===idx)+'">'+(i+1)+'. '+s.n+'</button>';
 });
 $('nav').innerHTML=h;
 Array.prototype.forEach.call($('nav').querySelectorAll('.nv'),function(b){
  b.onclick=function(){idx=+b.dataset.i;draw();};
 });
}
function draw(){
 var s=S[idx];
 $('pnum').textContent='شاشة '+(idx+1)+' من '+S.length+' · '+PH[s.p];
 $('ttl').textContent=s.n;
 $('meta').innerHTML='<span class="p">'+PH[s.p].split('—')[1].trim()+'</span>'+
  '<span>المستخدم: '+s.u+'</span><span>الجداول: '+s.t+'</span>';
 $('stage').innerHTML=s.h;
 $('why').innerHTML='<b>ليه كده:</b> '+s.why;
 $('prev').disabled=idx===0; $('next').disabled=idx===S.length-1;
 nav();
 window.scrollTo({top:0,behavior:'smooth'});
}
$('prev').onclick=function(){if(idx>0){idx--;draw();}};
$('next').onclick=function(){if(idx<S.length-1){idx++;draw();}};
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowLeft'&&idx<S.length-1){idx++;draw();}
 if(e.key==='ArrowRight'&&idx>0){idx--;draw();}
});
draw();
})();
</script>
