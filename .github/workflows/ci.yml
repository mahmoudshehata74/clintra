name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: web
        run: pnpm exec tsc -b --noEmit

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

  # A separate, parallel job from `build`: the e2e layer downloads a real
  # browser, which the fast unit-test job above should not have to wait on or
  # pay for. The opt-in screenshot capture (screenshots.spec.ts, tagged
  # @screenshot) is deliberately NOT run here — it produces PNGs for a human
  # visual review, which has no meaning on a headless CI runner with nothing
  # watching, so it stays a local-only command (pnpm test:e2e:screenshots).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Run e2e interaction tests
        working-directory: web
        run: pnpm exec playwright test --grep-invert @screenshot

  # Proves the Laravel backend builds, migrates cleanly against a real
  # Postgres (roles, schema, RLS policies included), and boots — and, via
  # tests/Feature/Rls, that isolation itself actually holds: every table has
  # RLS forced, a membership sees only its own scope, cross-org writes are
  # rejected by the database, etc. See api/docs/rls.md.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_superuser
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql

      - name: Install composer dependencies
        working-directory: api
        run: composer install --prefer-dist --no-progress

      - name: Copy environment file
        working-directory: api
        run: cp .env.example .env

      - name: Generate application key
        working-directory: api
        run: php artisan key:generate

      # Same role model as local dev (see api/docs/rls.md): clintra_owner
      # owns every table and runs migrations; clintra_app is what the app
      # connects as; clintra_rls is the NOLOGIN BYPASSRLS role the RLS
      # migration's SECURITY DEFINER helper functions run as; clintra_provision
      # (also NOLOGIN BYPASSRLS) owns provision_organization(jsonb), the one
      # door into an empty database — needed in every environment, including
      # production, unlike clintra_fixtures below. clintra_fixtures is a
      # fifth, test-only role (also BYPASSRLS) — tests/Feature/Rls uses it to
      # insert/clean up fixture data; it must never exist outside CI and
      # local dev (api/docs/rls.md). These passwords are throwaway, scoped to
      # this one job's ephemeral container — not real secrets.
      - name: Provision Postgres roles and databases
        env:
          PGPASSWORD: ci_postgres_superuser
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE clintra_owner LOGIN PASSWORD 'ci_owner_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE clintra_app LOGIN PASSWORD 'ci_app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE clintra_rls NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE clintra_provision NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE clintra_fixtures LOGIN PASSWORD 'ci_fixtures_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -c "GRANT clintra_rls TO clintra_owner;"
          psql -h 127.0.0.1 -U postgres -c "GRANT clintra_provision TO clintra_owner;"

          for db in clintra clintra_test; do
            psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE $db OWNER clintra_owner;"
            psql -h 127.0.0.1 -U postgres -d "$db" -c "ALTER SCHEMA public OWNER TO clintra_owner;"
            psql -h 127.0.0.1 -U postgres -d "$db" -c "GRANT USAGE ON SCHEMA public TO clintra_app;"
            psql -h 127.0.0.1 -U postgres -d "$db" -c "GRANT CREATE ON SCHEMA public TO clintra_rls;"
            psql -h 127.0.0.1 -U postgres -d "$db" -c "GRANT CREATE ON SCHEMA public TO clintra_provision;"
            psql -h 127.0.0.1 -U postgres -c "GRANT CONNECT ON DATABASE $db TO clintra_app;"
            psql -h 127.0.0.1 -U postgres -c "GRANT CONNECT ON DATABASE $db TO clintra_fixtures;"
            psql -h 127.0.0.1 -U postgres -d "$db" -c "GRANT USAGE ON SCHEMA public TO clintra_fixtures;"
            psql -h 127.0.0.1 -U postgres -d "$db" -c "ALTER DEFAULT PRIVILEGES FOR ROLE clintra_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO clintra_fixtures;"
          done

      - name: Point .env at the CI database
        working-directory: api
        run: |
          php -r '
            $env = file_get_contents(".env");
            $env = preg_replace("/^DB_USERNAME=.*/m", "DB_USERNAME=clintra_app", $env);
            $env = preg_replace("/^DB_APP_PASSWORD=.*/m", "DB_APP_PASSWORD=ci_app_pw", $env);
            $env = preg_replace("/^DB_OWNER_USERNAME=.*/m", "DB_OWNER_USERNAME=clintra_owner", $env);
            $env = preg_replace("/^DB_OWNER_PASSWORD=.*/m", "DB_OWNER_PASSWORD=ci_owner_pw", $env);
            $env = preg_replace("/^DB_FIXTURES_USERNAME=.*/m", "DB_FIXTURES_USERNAME=clintra_fixtures", $env);
            $env = preg_replace("/^DB_FIXTURES_PASSWORD=.*/m", "DB_FIXTURES_PASSWORD=ci_fixtures_pw", $env);
            file_put_contents(".env", $env);
          '

      - name: Run migrations (dev database)
        working-directory: api
        run: php artisan migrate --database=pgsql_owner --force

      - name: Run migrations (test database)
        working-directory: api
        env:
          DB_DATABASE: clintra_test
        run: php artisan migrate --database=pgsql_owner --force

      - name: Run tests
        working-directory: api
        run: php artisan test
